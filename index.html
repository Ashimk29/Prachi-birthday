<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 25px;
            border-radius: 25px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 42px;
            color: #ff4081;
            margin-bottom: 10px;
        }

        h2 {
            color: #555;
        }

        p {
            font-size: 20px;
            color: #444;
            line-height: 1.6;
        }

        .cake {
            font-size: 80px;
            animation: bounce 1s infinite alternate;
        }

        button {
            border: none;
            padding: 14px 25px;
            border-radius: 30px;
            background: #ff4081;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #e91e63;
        }

        #message {
            display: none;
            margin-top: 20px;
            font-weight: bold;
            color: #ff4081;
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(-15px);
            }
        }

        .balloon {
            position: absolute;
            font-size: 45px;
            animation: float 4s infinite ease-in-out;
        }

        .one {
            left: 10%;
            top: 10%;
        }

        .two {
            right: 10%;
            top: 15%;
        }

        .three {
            left: 15%;
            bottom: 10%;
        }

        .four {
            right: 15%;
            bottom: 10%;
        }

        @keyframes float {
            50% {
                transform: translateY(-30px);
            }
        }
    </style>
</head>

<body>

    <div class="balloon one">🎈</div>
    <div class="balloon two">🎈</div>
    <div class="balloon three">🎈</div>
    <div class="balloon four">🎈</div>

    <div class="card">

        <div class="cake">🎂</div>

        <h1>Happy Birthday! 🎉</h1>

        <h2>To Someone Special ❤️</h2>

        <p>
            Wishing you a wonderful birthday filled with
            happiness, laughter and amazing memories!
        </p>

        <button onclick="showMessage()">
            🎁 Open Your Surprise
        </button>

        <p id="message">
            ✨ May all your wishes come true! ✨
        </p>

    </div>

    <script>
        function showMessage() {
            document.getElementById("message").style.display = "block";
        }
    </script>

</body>
  </html>
